name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write
  packages: write

jobs:
  release:
    name: Verify and publish
    runs-on: ubuntu-latest
    env:
      NODE_AUTH_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN || github.token }}

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://npm.pkg.github.com
          scope: '@victor-software-house'
          always-auth: true

      - name: Verify tag matches package version
        run: |
          PKG_VERSION="$(jq -r '.version' package.json)"
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $PKG_VERSION"
            exit 1
          fi
          echo "Releasing $PKG_VERSION"

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Verify
        run: pnpm run verify

      - name: Verify package contents
        run: pnpm pack --dry-run

      - name: Preflight - refuse duplicate publish
        run: |
          NAME="$(jq -r '.name' package.json)"
          VERSION="$(jq -r '.version' package.json)"
          if npm view "$NAME@$VERSION" version --registry=https://npm.pkg.github.com >/dev/null 2>&1; then
            echo "::error::$NAME@$VERSION is already published to GitHub Packages"
            exit 1
          fi

      - name: Publish to GitHub Packages
        run: pnpm publish --no-git-checks --access restricted

      - name: Extract changelog body for this version
        id: changelog
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [ -f CHANGELOG.md ]; then
            BODY="$(awk -v v="$VERSION" '
              $0 ~ "^## " v "( |$)" { in_section=1; next }
              in_section && $0 ~ "^## " { in_section=0 }
              in_section { print }
            ' CHANGELOG.md)"
          else
            BODY=""
          fi
          if [ -z "${BODY// }" ]; then
            BODY="See repository history for details."
          fi
          {
            echo "body<<__CHANGELOG_EOF__"
            echo "$BODY"
            echo "__CHANGELOG_EOF__"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v3.0.0
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body: ${{ steps.changelog.outputs.body }}
